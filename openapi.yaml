openapi: 3.1.0
info:
  title: Bivia API
  version: 1.0.0
  description: |
    The Bivia API provides calibrated, typed decisions with confidence scores and
    evidence — not free-form text. Ask a question with context (text, images, audio,
    documents, or signals), and get back a structured answer: yes/no, pick-one,
    numeric score, multi-select, or text span — each with a probability distribution
    and an honest abstention when the model isn't confident enough.

    ## Decision types

    | Endpoint | What it returns |
    |---|---|
    | `POST /boolean` | `yes` or `no` with P(value) |
    | `POST /choice`  | One label from your list, with distribution |
    | `POST /decide`  | Auto-detects the best type from the question |
    | `POST /score`   | A number on your scale, with per-level mass |
    | `POST /set`     | Zero or more labels (multi-select) |
    | `POST /span`    | Character offsets into the input text |
    | `POST /extract` | Exact field values copied from document text, with offsets |
    | `POST /ground`  | Bounding boxes in an image or temporal intervals in a video |
    | `POST /ds`      | Decision over profiled numeric signals |
    | `POST /v1/systemone` | Multiple named typed answers in a single batch call |

    ## Key concepts

    - **Calibrated** — probabilities are meaningful, not just softmax scores.
    - **Abstention** — when the model is unsure, `status` is `abstained` and `value`
      is `null`. This is a feature: you always know whether to trust the answer.
    - **Multimodal** — attach text (`state`), images, documents, audio, or raw signals.
      The decision is made over whatever you provide.
    - **Evidence** — responses include `evidence.spans` with character offsets back
      into the input, so you can trace the reasoning.
    - **Typed and chainable** — every answer has a machine-readable type and value,
      ready to drive downstream logic without parsing.

    ## Modes

    - **`fast`** (default) — single-pass inference. Lowest latency.
    - **`deep`** — adds a verification step. Higher confidence on hard questions,
      at the cost of extra latency.

    ## Model

    The current model is **`dec-1`** (Bivia foundation decision model). The model
    identifier is returned in every response and can be discovered via `GET /v1/models`.
  contact:
    name: Articul8 AI
    url: https://articul8.ai
    email: support@articul8.ai
  license:
    name: Proprietary
    url: https://articul8.ai/eula

servers:
  - url: https://api.articul8.ai/bivia
    description: Production gateway

security:
  - bearerAuth: []

tags:
  - name: Decisions
    description: |
      Core decision primitives. Each endpoint takes a question with optional context
      and returns a typed, calibrated answer. Use the specific type endpoint when you
      know what kind of answer you want, or `POST /decide` to let the model auto-detect.
  - name: Evidence
    description: |
      Point at what supports an answer: extract text spans, exact
      document fields, image bounding boxes, and video temporal intervals.
  - name: Data Science
    description: |
      Decisions over raw numeric signals. The server profiles the signal and folds
      the analysis into context before deciding.
  - name: Batch
    description: |
      Ask multiple typed questions against the same context in a single request.
      Each question is independently typed (boolean, choice, score, set, or box) and
      independently answered.
  - name: Models
    description: Model discovery.
  - name: Service
    description: Health, readiness and capabilities.


x-stainless-config:
  package-name:
    python: bivia
    node: "@articul8/bivia"
    go: github.com/articul8/bivia-go
    rust: bivia

paths:
  # ── Decisions ──────────────────────────────────────────────────

  /boolean:
    post:
      tags: [Decisions]
      operationId: createBooleanDecision
      summary: Yes / no decision
      description: |
        Returns `yes` or `no` with a calibrated probability. `probability` is P(value),
        not always P(yes) — if the answer is `no`, then `probability` is P(no).

        The `distribution` object always contains both `yes` and `no` keys summing to 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooleanRequest"
            examples:
              text_only:
                summary: Text question
                value:
                  state: I was double-charged and support never replied.
                  question: Is this urgent?
              with_image:
                summary: Question about an image
                value:
                  question: Does the image show a damaged product?
                  images:
                    - url: https://example.com/product-photo.jpg
              with_document:
                summary: Question about a document
                value:
                  question: Does this contract contain an auto-renewal clause?
                  documents:
                    - url: https://example.com/contract.pdf
              with_audio:
                summary: Question about an audio clip
                value:
                  question: Is the caller asking to cancel their subscription?
                  audio:
                    - url: https://example.com/support-call.wav
      responses:
        "200":
          description: 'Decision envelope with `type: "boolean"`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanDecision"
              examples:
                answered:
                  summary: Confident answer
                  value:
                    type: boolean
                    value: "no"
                    probability: 0.94
                    distribution:
                      "yes": 0.06
                      "no": 0.94
                    status: answered
                    abstain_reason: null
                    mode: fast
                    think_allowed: false
                    thought: false
                    verification:
                      performed: false
                      result: not_applicable
                    evidence:
                      spans: []
                    latency_ms: 90.0
                    model: dec-1
                    input_tokens: 245
                    billable_tokens: 1000
                abstained:
                  summary: Model abstains (not confident enough)
                  value:
                    type: boolean
                    value: null
                    distribution:
                      "yes": 0.52
                      "no": 0.48
                    status: abstained
                    abstain_reason: low_confidence
                    mode: fast
                    think_allowed: true
                    thought: false
                    verification:
                      performed: false
                      result: not_applicable
                    evidence:
                      spans: []
                    latency_ms: 85.0
                    model: dec-1
                    input_tokens: 245
                    billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  /choice:
    post:
      tags: [Decisions]
      operationId: createChoiceDecision
      summary: Pick one from a list
      description: |
        Selects the best option from your `choices` list. Returns the chosen label,
        P(choice), and the full distribution over all options.

        At least 2 choices are required. More than 26 is rejected (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoiceRequest"
            examples:
              text_only:
                summary: Classify a support ticket
                value:
                  state: I am NOT asking for a refund, I only need a copy of my invoice.
                  question: Which team handles this?
                  choices: [billing, refunds, technical]
              with_image:
                summary: Classify from an image
                value:
                  question: Which team name is printed in the image?
                  choices: [BILLING, TECHNICAL]
                  images:
                    - url: https://example.com/label.png
              with_document:
                summary: Classify a document
                value:
                  question: What type of agreement is this?
                  choices: [NDA, MSA, SOW]
                  documents:
                    - url: https://example.com/agreement.pdf
              with_audio:
                summary: Classify an audio clip
                value:
                  question: Which department should this call be routed to?
                  choices: [billing, refunds, technical]
                  audio:
                    - url: https://example.com/support-call.wav
      responses:
        "200":
          description: 'Decision envelope with `type: "choice"`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoiceDecision"
              example:
                type: choice
                value: billing
                probability: 0.93
                distribution:
                  billing: 0.93
                  refunds: 0.04
                  technical: 0.03
                status: answered
                abstain_reason: null
                mode: fast
                think_allowed: true
                thought: false
                verification:
                  performed: false
                  result: not_applicable
                evidence:
                  spans: []
                latency_ms: 110.0
                model: dec-1
                input_tokens: 320
                billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  /decide:
    post:
      tags: [Decisions]
      operationId: createDecision
      summary: Auto-detect decision type
      description: |
        Analyzes the question and automatically selects the best decision type
        (boolean, choice, score, etc.) and extracts options when applicable.

        Use this when you don't know the answer type in advance. The response
        `type` field tells you which type was selected.

        Provide `outcomes` to constrain the options; otherwise the model infers
        them from the question text. At least 2 outcomes are required when provided.
        More than 26 is rejected (422). Without `outcomes`, a question about the
        attached images (e.g., "Where is the red square?") can return a grounding
        response (`type: "ground"`), and `read_as` reports how the question was framed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
            examples:
              text_only:
                summary: Explicit outcomes
                value:
                  state: Patient has fever, cough, and a right lower lobe infiltrate on chest x-ray.
                  question: Most likely diagnosis?
                  outcomes: [common cold, pneumonia, healthy]
              auto_detect:
                summary: Let the model infer type and options
                value:
                  state: The quarterly revenue was $4.2M, up 15% from last quarter.
                  question: Is this a good quarter?
              with_image:
                summary: Decide over an image
                value:
                  question: What condition is shown in this scan?
                  outcomes: [common cold, pneumonia, healthy]
                  images:
                    - url: https://example.com/chest-xray.png
              with_document:
                summary: Decide over a document
                value:
                  question: Should legal approve this vendor contract?
                  outcomes: [approve, request changes, reject]
                  documents:
                    - url: https://example.com/vendor-contract.pdf
              with_audio:
                summary: Decide over an audio clip
                value:
                  question: What should the agent do next?
                  outcomes: [issue refund, escalate to supervisor, close ticket]
                  audio:
                    - url: https://example.com/support-call.wav
      responses:
        "200":
          description: |
            Decision envelope. The `type` field indicates which decision type was selected
            (`decide`, `boolean`, `choice`, `score`, etc.).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CategoricalDecision"
                  - $ref: "#/components/schemas/ScoreDecision"
                  - $ref: "#/components/schemas/SetDecision"
                  - $ref: "#/components/schemas/SpanDecision"
                  - $ref: "#/components/schemas/GroundDecision"
              examples:
                answered:
                  summary: Confident answer
                  value:
                    type: decide
                    value: pneumonia
                    probability: 0.99
                    distribution:
                      common cold: 0.01
                      pneumonia: 0.99
                      healthy: 0.0
                    status: answered
                    abstain_reason: null
                    mode: fast
                    think_allowed: false
                    thought: false
                    verification:
                      performed: false
                      result: not_applicable
                    evidence:
                      spans: []
                    latency_ms: 110.0
                    model: dec-1
                    input_tokens: 380
                    billable_tokens: 1000
                abstained:
                  summary: Model abstains
                  value:
                    type: decide
                    value: null
                    distribution:
                      common cold: 0.4
                      pneumonia: 0.35
                      healthy: 0.25
                    status: abstained
                    abstain_reason: low_confidence
                    mode: fast
                    think_allowed: true
                    thought: false
                    verification:
                      performed: false
                      result: not_applicable
                    evidence:
                      spans: []
                    latency_ms: 110.0
                    model: dec-1
                    input_tokens: 380
                    billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  /score:
    post:
      tags: [Decisions]
      operationId: createScoreDecision
      summary: Numeric score on a scale
      description: |
        Returns the expected value on a numeric scale defined by `range` (default
        `[0, 1]`), divided into `buckets` evenly spaced levels (default 11). The
        `levels` object shows the probability mass at each level.

        There is no single `probability` field for scores; instead, the full
        distribution is in `levels`. `buckets` must be at least 2.

        If the question text does not already name both range endpoints, the server
        appends "Answer on a numeric scale from {lo} to {hi}." so the model sees the
        scale.

        Audio is accepted only on deployments that transcribe speech; otherwise a
        request with `audio` returns `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
            examples:
              text_only:
                summary: Urgency score 0–1
                value:
                  state: Customer threatened to cancel today.
                  question: How urgent is this (0=none, 1=critical)?
                  range: [0, 1]
                  buckets: 11
              ten_point:
                summary: Rating on a 0–10 scale
                value:
                  state: The restaurant had great food but terrible service.
                  question: Overall dining experience?
                  range: [0, 10]
                  buckets: 11
              with_image:
                summary: Score from an image
                value:
                  question: How severe is the surface damage (0=none, 10=total loss)?
                  range: [0, 10]
                  buckets: 11
                  images:
                    - url: https://example.com/product-photo.jpg
              with_document:
                summary: Score a document
                value:
                  question: What is the compliance risk of this agreement (0=low, 1=high)?
                  range: [0, 1]
                  buckets: 11
                  documents:
                    - url: https://example.com/contract.pdf
              with_audio:
                summary: Score an audio clip
                value:
                  question: How frustrated is the caller (0=calm, 10=very frustrated)?
                  range: [0, 10]
                  buckets: 11
                  audio:
                    - url: https://example.com/support-call.wav
      responses:
        "200":
          description: 'Decision envelope with `type: "score"`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreDecision"
              example:
                type: score
                value: 0.7
                levels:
                  "0": 0.02
                  "0.1": 0.03
                  "0.2": 0.05
                  "0.3": 0.05
                  "0.4": 0.05
                  "0.5": 0.1
                  "0.6": 0.15
                  "0.7": 0.2
                  "0.8": 0.15
                  "0.9": 0.1
                  "1": 0.1
                status: answered
                abstain_reason: null
                mode: fast
                think_allowed: false
                thought: false
                verification:
                  performed: false
                  result: not_applicable
                evidence:
                  spans: []
                latency_ms: 95.0
                model: dec-1
                input_tokens: 290
                billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  /set:
    post:
      tags: [Decisions]
      operationId: createSetDecision
      summary: Multi-select from a list
      description: |
        Independent yes/no probability per option (not a distribution that sums to 1).
        `value` contains every option whose probability is at least 0.5, in request
        order. The `probabilities` map shows the independent P(applies) for each option.

        Audio is accepted only on deployments that transcribe speech; otherwise a
        request with `audio` returns `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRequest"
            examples:
              text_only:
                summary: Select applicable actions
                value:
                  state: Order arrived damaged and the customer wants money back.
                  question: Which actions apply?
                  options: [cancel, refund, status]
              with_image:
                summary: Select labels from an image
                value:
                  question: Which defects are visible in the photo?
                  options: [scratch, dent, crack, discoloration]
                  images:
                    - url: https://example.com/product-photo.jpg
              with_document:
                summary: Select clauses in a document
                value:
                  question: Which clauses are present in this contract?
                  options: [auto-renewal, indemnification, non-compete, limitation of liability]
                  documents:
                    - url: https://example.com/contract.pdf
              with_audio:
                summary: Select topics from an audio clip
                value:
                  question: Which topics were discussed on the call?
                  options: [billing, cancellation, refund, technical support]
                  audio:
                    - url: https://example.com/support-call.wav
      responses:
        "200":
          description: 'Decision envelope with `type: "set"`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDecision"
              example:
                type: set
                value: [cancel, refund]
                probabilities:
                  cancel: 0.93
                  refund: 0.87
                  status: 0.11
                status: answered
                abstain_reason: null
                mode: fast
                think_allowed: true
                thought: false
                verification:
                  performed: false
                  result: not_applicable
                evidence:
                  spans: []
                latency_ms: 450.0
                model: dec-1
                input_tokens: 310
                billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  /span:
    post:
      tags: [Evidence]
      operationId: createSpanDecision
      summary: Locate text spans in the input
      description: |
        Returns character offset ranges into `state` that answer the question.
        `value` is an array of `{start, end, text}` objects, where `text` is the
        quoted substring from the input.

        `/span` always runs in fast mode. Sending `mode: "deep"` or `think: true`
        is rejected (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpanRequest"
            example:
              state: This agreement renews automatically for one year unless either party cancels.
              question: Where is the auto-renewal clause?
      responses:
        "200":
          description: 'Decision envelope with `type: "span"`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpanDecision"
              example:
                type: span
                value:
                  - start: 0
                    end: 78
                    text: This agreement renews automatically for one year unless either party cancels.
                status: answered
                abstain_reason: null
                mode: fast
                think_allowed: false
                thought: false
                verification:
                  performed: false
                  result: not_applicable
                evidence:
                  spans:
                    - start: 0
                      end: 78
                      text: This agreement renews automatically for one year unless either party cancels.
                latency_ms: 80.0
                model: dec-1
                input_tokens: 220
                billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  # ── Evidence ───────────────────────────────────────────────────

  /extract:
    post:
      tags: [Evidence]
      operationId: extractFields
      summary: Extract field values from a document
      description: |
        Extracts one field (`question`) or multiple fields (`fields`) from `state` or
        attached `documents`, returning the exact text from the document along with its
        character offsets (`start`, `end`). Values are copied directly from the source,
        never paraphrased or generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
            examples:
              single_field:
                summary: Single field
                value:
                  state: Either party may terminate this agreement with 60 days written notice.
                  question: termination notice period
              multiple_fields:
                summary: Multiple fields
                value:
                  state: Either party may terminate this agreement with 60 days written notice.
                  fields: [termination notice period, governing law]
              from_document:
                summary: From a document
                value:
                  question: termination notice period
                  documents:
                    - url: https://example.com/contract.pdf
      responses:
        "200":
          description: Successful Response. `ExtractResult` for `question`, `ExtractFieldsResult` for `fields`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExtractResult"
                  - $ref: "#/components/schemas/ExtractFieldsResult"
              examples:
                single_field:
                  summary: Single Field (ExtractResult)
                  value:
                    type: extract
                    field: termination notice period
                    value: 60 days
                    start: 47
                    end: 54
                    confidence: 0.94
                    found: true
                    grounded: true
                    input_tokens: 24
                    image_tokens: 0
                    billable_tokens: 1000
                multiple_fields:
                  summary: Multiple Fields (ExtractFieldsResult)
                  value:
                    type: extract
                    grounded: true
                    values:
                      termination notice period:
                        type: extract
                        field: termination notice period
                        value: 60 days
                        start: 47
                        end: 54
                        confidence: 0.94
                        found: true
                        grounded: true
                      governing law:
                        type: extract
                        field: governing law
                        value: null
                        found: false
                        grounded: true
                    input_tokens: 48
                    image_tokens: 0
                    billable_tokens: 1000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  # ── Grounding ──────────────────────────────────────────────────

  /ground:
    post:
      tags: [Evidence]
      operationId: createGroundingDecision
      summary: Visual grounding — locate objects in images or video
      description: |
        Open-vocabulary visual grounding over images or video clips. Finds objects matching `question` in the
        provided image(s) and returns bounding boxes.

        - **Images (`images`)** — finds regions matching `question` and returns
          `{label, box: [x1, y1, x2, y2]}` normalized to `[0, 1000]`.
        - **Video (`video`)** — scans a clip for objects (`kind: "object"`, returning
          `start`, `end`, `peak_t`, and peak-frame `boxes`) or events (`kind: "event"`,
          returning `onset_t` timestamps).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroundRequest"
            examples:
              image_by_url:
                summary: Image by URL
                value:
                  question: the invoice total
                  images:
                    - url: https://example.com/invoice.png
              image_by_base64:
                summary: Image by base64
                value:
                  question: the red square
                  images:
                    - b64: "<base64-encoded PNG bytes>"
                      mime: image/png
              video_scan:
                summary: Video object scan
                value:
                  question: delivery truck
                  kind: object
                  video:
                    url: https://example.com/clip.mp4
      responses:
        "200":
          description: 'Grounding envelope (`type: "ground"` for images, `type: "video_ground"` for video).'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GroundDecision"
                  - $ref: "#/components/schemas/VideoGroundDecision"
              examples:
                image_grounding:
                  summary: Image grounding
                  value:
                    type: ground
                    value:
                      - label: the red square
                        box: [197.0, 200.0, 812.0, 807.0]
                    count: 1
                    found: true
                    grounded: true
                    input_tokens: 286
                    image_tokens: 256
                    billable_tokens: 1000
                video_grounding:
                  summary: Video grounding
                  value:
                    type: video_ground
                    kind: object
                    duration_s: 10.0
                    scanned: 12
                    truncated: false
                    hits:
                      - start: 4.0
                        end: 8.0
                        peak_t: 6.0
                        confidence: 0.98
                        boxes:
                          - label: delivery truck
                            box: [120, 340, 610, 880]
                    input_tokens: 884
                    image_tokens: 768
                    billable_tokens: 1000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  # ── Data Science ───────────────────────────────────────────────

  /ds:
    post:
      tags: [Data Science]
      operationId: createDataDecision
      summary: Decision from raw signals
      description: |
        Analyzes raw numeric series (`signals`) and answers your `question` using the
        candidate answers in `options`.

        Use `kind` to choose the answer format: `set` (default, select all that apply),
        `choice` (pick one), or `boolean` (yes/no).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataDecisionRequest"
            example:
              signals:
                - name: temperature
                  data: [[72.1, 73.5, 89.2, 91.0, 88.5, 72.0]]
                  fs: 1
              question: Which analysis method fits this signal?
              kind: choice
              options: ["spectral analysis (FFT)", "linear regression"]
              think: false
      responses:
        "200":
          description: Standard decision envelope.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SetDecision"
                  - $ref: "#/components/schemas/CategoricalDecision"
              example:
                type: choice
                value: linear regression
                probability: 0.88
                distribution:
                  "spectral analysis (FFT)": 0.12
                  linear regression: 0.88
                status: answered
                abstain_reason: null
                mode: fast
                think_allowed: false
                thought: false
                verification:
                  performed: false
                  result: not_applicable
                evidence:
                  spans: []
                latency_ms: 140.0
                model: dec-1
                input_tokens: 224
                billable_tokens: 1000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  # ── Batch ──────────────────────────────────────────────────────

  /v1/systemone:
    post:
      tags: [Batch]
      operationId: createBatchDecision
      summary: Multiple typed questions in one request
      description: |
        Send one context (`state`, plus optional images/documents/signals) and many
        named questions. Each question is independently typed and answered.

        **Question types:** `boolean` (or `noul` / `bool`), `choice`, `score`, `set`,
        `box` (visual grounding). Unknown types are rejected (422).

        **Defaults:** fast mode, no thinking, no abstention. Set `mode: "deep"` to
        enable abstention (`abstained: true` is then possible on individual answers).

        Each question is metered independently; `usage.billable_tokens` is the sum
        of per-question minimums.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
            example:
              state: I was double-charged and support never replied.
              questions:
                team:
                  type: choice
                  instructions: Which team?
                  criteria:
                    billing: Billing disputes and invoices
                    tech: Product defects
                    sales: New purchases
                urgent:
                  type: boolean
                  instructions: Is this urgent?
                risk:
                  type: score
                  instructions: Churn risk from 0 to 1
                  buckets: 5
      responses:
        "200":
          description: Named answers keyed by question name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
              example:
                model: dec-1
                answers:
                  team:
                    type: choice
                    choice: billing
                    confidence: 0.93
                    probabilities:
                      billing: 0.93
                      tech: 0.04
                      sales: 0.03
                    abstained: false
                  urgent:
                    type: noul
                    probability: 0.88
                    confidence: 0.88
                    abstained: false
                  risk:
                    type: score
                    score: 0.75
                    confidence: 0.6
                    distribution:
                      "0": 0.05
                      "0.25": 0.1
                      "0.5": 0.2
                      "0.75": 0.6
                      "1": 0.05
                    abstained: false
                usage:
                  questions: 3
                  input_tokens: 1200
                  billable_tokens: 3000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

  # ── Models ─────────────────────────────────────────────────────

  /capabilities:
    get:
      tags: [Service]
      operationId: getCapabilities
      summary: Discover available decision types and modalities
      description: |
        Returns the model's supported decision types, input modalities, evidence
        modes, and whether abstention is enabled — for this deployment.
      responses:
        "200":
          description: Capabilities document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
              example:
                model: dec-1
                decision_types:
                  [decide, boolean, choice, score, set, span, ground]
                modalities:
                  text:
                    available: true
                  image:
                    available: true
                    grounding_available: true
                  document:
                    available: true
                  audio:
                    available: true
                evidence:
                  text_spans: /span -> value:[{start,end,text}]
                  available: true
                extraction:
                  endpoint: /extract
                  available: true
                  input: state/documents (document text) + question (one field) or fields:[...] (several)
                  output: exact source value(s) + char offsets, copied from the document not generated (grounded)
                  note: field extraction with no generation step.
                abstention: true
                openapi: /openapi.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List available models
      description: Returns the models available on this deployment.
      responses:
        "200":
          description: Model list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              example:
                models:
                  - name: bivia
                    description: Bivia — foundation decision model (System-One compatible).
                    release_date: "2026-10-20"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /health:
    get:
      tags: [Service]
      operationId: healthCheck
      summary: Liveness
      description: |
        Returns `200 OK` while the service process is alive; `ready` reports whether warmup has completed and the
        replica can serve decisions.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                ready: true
                model: dec-1
                capabilities:
                  model: dec-1
                  abstention: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /ready:
    get:
      tags: [Service]
      operationId: readinessCheck
      summary: Readiness
      description: |
        Kubernetes readiness probe. Returns `200 OK` when static-shape warmup is complete and the device is healthy,
        or `503 Service Unavailable` otherwise.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ready: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Overloaded"

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: apikey
      description: API key in the `apikey` header.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Pass your API key or access token as `Authorization: Bearer <token>`.

  responses:
    Unprocessable:
      description: |
        The request is syntactically valid but semantically invalid — for example,
        too many options (> 26), an unknown question type, or an invalid mode value.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/InvalidRequest"
              - $ref: "#/components/schemas/ValidationError"
    Overloaded:
      description: Server is at capacity. Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: string
            example: "1"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Overloaded"
    BadRequest:
      description: The media could not be read (e.g. a video that does not decode).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            detail: "could not decode video: no video stream"
    Unauthorized:
      description: Missing or invalid API key or access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            message: Authentication required
    PayloadTooLarge:
      description: The request body, an image, a document or a video is over its size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: payload too large
            limit_mb: 256
    ServerError:
      description: Unexpected server error. Retrying may succeed; report persistent errors with the request id.

  schemas:
    # ── Input types ────────────────────────────────────────────

    ImageRef:
      type: object
      description: |
        An image to include as context. Provide either `url` (public HTTP/HTTPS) or
        `b64` (base64-encoded bytes with `mime`). At most 16 images per request,
        each ≤ 25 MB and ≤ 50 megapixels.
      properties:
        url:
          type: string
          description: Public HTTP(S) image URL. The server fetches it within a shared 60-second budget.
          example: https://example.com/photo.png
        b64:
          type: string
          description: Base64-encoded image bytes (raw base64, not a `data:` URL). Pair with `mime`.
        mime:
          type: string
          default: image/png
          description: MIME type for `b64` content. Must be an `image/*` type.
          example: image/png

    AudioRef:
      type: object
      description: |
        An audio clip to include as context. Provide either `url` or `b64` (with `mime`).
        Supported formats: WAV, MP3, OGG, FLAC. Auto-resampled to 16 kHz.
      properties:
        url:
          type: string
          description: Public HTTP(S) audio URL.
        b64:
          type: string
          description: Base64-encoded audio bytes.
        mime:
          type: string
          default: audio/wav
          description: MIME type for `b64` content.
          example: audio/wav

    DocumentRef:
      type: object
      description: |
        A document to include as context. The server extracts plain text and folds it
        into the decision context. Supported formats: PDF, DOCX, PPTX, XLSX, JSON,
        CSV/TSV, TXT, Markdown, HTML, source code.

        Limits: 25 MB per file, 16 documents per request, 48,000 extracted characters total.
      properties:
        url:
          type: string
          description: Public HTTP(S) URL to fetch the document from.
        b64:
          type: string
          description: Base64-encoded file bytes.
        filename:
          type: string
          description: Helps format detection (e.g., `memo.txt`, `contract.pdf`).
        mime:
          type: string
          description: MIME type of the document.

    SignalRef:
      type: object
      description: A raw numeric signal for data-science decisions.
      required: [data]
      properties:
        name:
          type: string
          default: signal
          description: Human-readable name for the signal.
        data:
          description: |
            Signal data as `[channels][timesteps]` (list of lists). Each inner list is
            one channel of samples.
        channels:
          type: integer
          description: Number of channels (required when `data` is a base64 buffer).
        fs:
          type: number
          description: Sample rate in Hz.
        dtype:
          type: string
          default: float32
          description: Data type when `data` is a base64 buffer.

    VideoRef:
      type: object
      description: A video clip. Provide `url` or `b64`. Maximum 200 MB.
      properties:
        url:
          type: string
          description: Public HTTP(S) video URL.
        b64:
          type: string
          description: Base64-encoded video bytes.
        mime:
          type: string
          default: video/mp4
        max_edge:
          type: integer
          minimum: 64
          maximum: 1792
          default: 896
          description: Downscale frame long edge to this size before processing.

    # ── Decision request fields ────────────────────────────────

    Mode:
      type: string
      enum: [fast, deep]
      default: fast
      description: |
        `fast` — single-pass inference (lowest latency, default).
        `deep` — adds a verification step for higher confidence on hard questions.
        Any other value is rejected (422).

    DecisionFields:
      type: object
      description: Common fields shared by all decision request types.
      properties:
        state:
          type: string
          default: ""
          description: Text context for the decision. May be empty when images or documents carry the context.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
          description: Optional images to include as context.
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioRef"
          description: Optional audio clips to include as context.
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
          description: Optional documents to include as context.
        question:
          type: string
          description: The question to decide.
        domain:
          type: string
          description: Optional domain hint for specialized few-shot behavior (e.g., `finance`).
        mode:
          $ref: "#/components/schemas/Mode"
        think:
          type: boolean
          default: true
          description: |
            Whether to allow a reasoning trace before deciding. Only honored in `fast`
            mode; ignored for `deep`. Set to `false` for lowest latency.
        allow_abstain:
          type: boolean
          default: true
          description: |
            When `true` (default), the model may abstain if it lacks confidence.
            When `false`, abstention is replaced by the best-effort answer.

    # ── Decision requests ──────────────────────────────────────

    BooleanRequest:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [question]

    ChoiceRequest:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [question, choices]
          properties:
            choices:
              type: array
              minItems: 2
              maxItems: 26
              items:
                type: string
              description: The options to choose from (2–26 items).

    DecideRequest:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [question]
          properties:
            outcomes:
              type: array
              minItems: 2
              maxItems: 26
              items:
                type: string
              description: |
                Candidate outcomes (2–26 items). When omitted, the model infers
                options from the question text.

    ScoreRequest:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [question]
          properties:
            range:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              default: [0.0, 1.0]
              description: Inclusive `[low, high]` of the numeric scale.
            buckets:
              type: integer
              minimum: 2
              default: 11
              description: Number of evenly spaced levels on the scale.

    SetRequest:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [question, options]
          properties:
            options:
              type: array
              items:
                type: string
              description: The options to select from (zero or more may be selected).

    SpanRequest:
      type: object
      required: [question]
      properties:
        state:
          type: string
          default: ""
          description: The text to search for spans in.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
          description: Optional images (spans are still character ranges into `state`).
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
        question:
          type: string
          description: What to locate in the text.
        domain:
          type: string
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioRef"
          description: 'Audio clips to decide over: each `{b64, mime}` or `{url}`. Only on deployments where /capabilities reports audio available.'
        mode:
          type: string
          enum: [fast]
          default: fast
          description: '/span has a single path: only "fast" is accepted.'
        think:
          type: boolean
          default: false
          description: '/span never thinks: only false is accepted.'

    GroundRequest:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: What to find (e.g., "the invoice total", "the crack"). Empty detects regions broadly.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
          description: The image(s) to search.
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
        state:
          type: string
          default: ""
        domain:
          type: string
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioRef"
          description: 'Audio clips to decide over: each `{b64, mime}` or `{url}`. Only on deployments where /capabilities reports audio available.'
        video:
          $ref: "#/components/schemas/VideoRef"
          description: 'A video clip instead of images: the response is a video scan (`VideoGroundResult`).'
        mode:
          type: string
          enum: [fast, deep]
          default: fast
          description: 'Images: "fast" returns the single best match, "deep" every match.'
        min_region_patches:
          type: integer
          minimum: 1
          default: 1
          description: 'Deep mode only: ignore regions smaller than this many patches (`>= 1`).'
        kind:
          type: string
          enum: [object, event]
          default: object
          description: 'Video only: "object" or "event".'
        coarse_step:
          type: number
          exclusiveMinimum: 0
          default: 5.0
          description: 'Video only: seconds between coarse presence probes.'
        fine_resolution:
          type: number
          exclusiveMinimum: 0
          default: 0.5
          description: 'Video only: seconds; precision of the onset search.'
        boxes_on_hits:
          type: boolean
          default: true
          description: 'Video only: also return regions on each hit''s peak frame.'
        max_probes:
          type: integer
          minimum: 1
          default: 200
          description: 'Video only: maximum frames to examine.'
        allow_abstain:
          type: boolean
          default: true
          description: 'Allow `status: "abstained"` (value null) when no candidate clears the confidence bar.'

    VideoScanRequest:
      type: object
      required: [video, query]
      properties:
        video:
          $ref: "#/components/schemas/VideoRef"
        query:
          type: string
          description: What to find in the video.
        kind:
          type: string
          enum: [object, event]
          default: object
          description: |
            `object` — find temporal intervals where the object appears, with bounding boxes.
            `event` — find the onset timestamp of a happening.
        coarse_step:
          type: number
          exclusiveMinimum: 0
          default: 5.0
          description: Seconds between coarse scan samples.
        fine_resolution:
          type: number
          exclusiveMinimum: 0
          default: 0.5
          description: Seconds between fine scan samples within detected intervals.
        boxes_on_hits:
          type: boolean
          default: true
          description: Whether to return per-frame bounding boxes on hit intervals.
        max_probes:
          type: integer
          minimum: 1
          default: 200
          description: Maximum number of frames to probe.
        allow_abstain:
          type: boolean
          default: true

    DataDecisionRequest:
      type: object
      required: [question]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalRef"
          description: Raw numeric signals to analyze.
        state:
          type: string
          default: ""
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioRef"
          description: 'Audio clips to decide over: each `{b64, mime}` or `{url}`. Only on deployments where /capabilities reports audio available.'
        question:
          type: string
        options:
          type: array
          items:
            type: string
          description: Candidate answers. Required for useful `choice` or `set` results.
        kind:
          type: string
          enum: [set, choice, boolean]
          default: set
          description: Which decision type to use.
        domain:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        think:
          type: boolean
          default: true
        allow_abstain:
          type: boolean
          default: true

    # ── Batch request/response ─────────────────────────────────

    BatchRequest:
      type: object
      properties:
        model:
          type: string
          description: Accepted for compatibility. The response model is always `dec-1`.
        state:
          type: string
          default: ""
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageRef"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioRef"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalRef"
        assets:
          type: ["object", "null"]
          additionalProperties: true
          description: 'System-One assets map: `{ name: { type: "image" | "audio", format, data_base64 } }`.'
        questions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BatchQuestion"
          description: Map of question name → typed question definition.
        mode:
          $ref: "#/components/schemas/Mode"

    BatchQuestion:
      type: object
      properties:
        type:
          type: string
          description: |
            `boolean` (or `noul` / `bool`), `choice`, `score`, `set`, `box`.
            Unknown types are rejected (422). Defaults to `choice` when omitted.
          example: choice
        instructions:
          type: string
          description: The question text.
        question:
          type: string
          description: Alternative to `instructions`.
        criteria:
          description: |
            Choice options. An object maps option key → description; a list of names
            is also accepted.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                x-stainless-any: true
        options:
          type: array
          items:
            x-stainless-any: true
          description: Choice names (used when `criteria` is empty).
        levels:
          description: |
            Score bucket labels. Must be a list when present; a non-list type is
            rejected (422). Array length sets the bucket count.
          type: ["array", "null"]
        buckets:
          type: integer
          default: 11
          minimum: 2
          description: Score bucket count when `levels` is not provided.

    BatchResponse:
      type: object
      required: [model, answers, usage]
      properties:
        model:
          type: string
          enum: [dec-1]
        answers:
          type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/BatchChoiceAnswer"
              - $ref: "#/components/schemas/BatchBooleanAnswer"
              - $ref: "#/components/schemas/BatchScoreAnswer"
              - $ref: "#/components/schemas/BatchSetAnswer"
              - $ref: "#/components/schemas/BatchBoxAnswer"
          description: Answers keyed by the question names from the request.
        usage:
          $ref: "#/components/schemas/Usage"

    BatchChoiceAnswer:
      type: object
      required: [type, choice, abstained]
      properties:
        type:
          type: string
          enum: [choice]
        choice: {}
        confidence:
          type: ["number", "null"]
          description: P(choice). Null when abstained.
        probabilities:
          type: object
          additionalProperties:
            type: number
        abstained:
          type: boolean

    BatchBooleanAnswer:
      type: object
      required: [type, abstained]
      properties:
        type:
          type: string
          enum: [noul]
        noul:
          type: number
          description: P(yes) in [0, 1].
        probability:
          type: number
          description: Same as `noul` — P(yes).
        confidence:
          type: ["number", "null"]
        abstained:
          type: boolean

    BatchScoreAnswer:
      type: object
      required: [type, score, abstained]
      properties:
        type:
          type: string
          enum: [score]
        score:
          type: ["number", "null"]
          description: Expected value on [0, 1]. Null when abstained.
        confidence:
          type: ["number", "null"]
        legend:
          type: object
          additionalProperties:
            type: string
          description: Index → label mapping from the criteria array.
        probabilities:
          type: object
          additionalProperties:
            type: number
        distribution:
          type: object
          additionalProperties:
            type: number
        abstained:
          type: boolean

    BatchSetAnswer:
      type: object
      required: [type, selected, abstained]
      properties:
        type:
          type: string
          enum: [set]
        selected:
          type: array
          items:
            x-stainless-any: true
          description: Options selected (probability ≥ 0.5).
        probabilities:
          type: object
          additionalProperties:
            type: number
        abstained:
          type: boolean

    BatchBoxAnswer:
      type: object
      required: [type, abstained]
      properties:
        type:
          type: string
          enum: [box]
        box:
          type: ["object", "null"]
          properties:
            left:
              type: number
            top:
              type: number
            right:
              type: number
            bottom:
              type: number
          description: Normalized [0, 1] bounding box. Null when abstained.
        label:
          type: string
        confidence:
          type: ["number", "null"]
        abstained:
          type: boolean

    # ── Response types ─────────────────────────────────────────

    Verification:
      type: object
      required: [performed, result]
      properties:
        performed:
          type: boolean
          description: Whether the verification step ran (only in `deep` mode).
        result:
          type: string
          enum: [passed, conflict, insufficient, not_applicable]
          description: |
            `passed` — verification confirmed the answer.
            `conflict` — verification disagreed (triggers abstention in deep mode).
            `insufficient` — not enough evidence to verify.
            `not_applicable` — verification was not performed (fast mode).

    EvidenceSpan:
      type: object
      required: [start, end, text]
      properties:
        start:
          type: integer
          description: Inclusive character offset into the `state` text.
        end:
          type: integer
          description: Exclusive character offset.
        text:
          type: string
          description: The quoted substring.

    Evidence:
      type: object
      properties:
        spans:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSpan"
          description: Character ranges in the input text that support the decision.

    DocumentNote:
      type: object
      required: [document, status]
      properties:
        document:
          type: string
          description: |
            Filename or URL of the document, or `(remaining)` for documents that were
            never read because the context limit was already reached.
        status:
          type: string
          enum: [included, skipped]
        chars:
          type: integer
          description: Number of characters extracted.
        tokens:
          type: integer
        truncated:
          type: boolean
          description: |
            Present and `true` on an `included` document whose text was cut to fit the
            context limit (about 48,000 characters).
        reason:
          type: string
          description: Why the document was skipped.

    EnvelopeBase:
      type: object
      description: |
        The decision envelope — every decision endpoint returns this structure.
        The `type` field indicates which decision type produced the answer, and
        `value` contains the typed result.
      required:
        [
          type,
          value,
          status,
          mode,
          thought,
          verification,
          evidence,
          latency_ms,
          model
        ]
      properties:
        type:
          type: string
          description: The decision type that produced this answer.
        value: {}
        status:
          type: string
          enum: [answered, abstained]
          description: |
            `answered` — the model produced a confident answer.
            `abstained` — the model was not confident enough; `value` is `null`.
        abstain_reason:
          type: ["string", "null"]
          enum:
            - low_confidence
            - readout_disagreement
            - insufficient_evidence
            - unresolved_after_thinking
            - null
          description: |
            Why the model abstained. `null` when `status` is `answered`.
            - `low_confidence` — probability mass was too spread out.
            - `readout_disagreement` — deep verification found a conflict.
            - `insufficient_evidence` — not enough context to decide.
            - `unresolved_after_thinking` — reasoning did not resolve ambiguity.
        mode:
          type: string
          enum: [fast, deep, audio]
          description: |
            The mode that ran. `audio` is reported when an audio clip was decided
            directly; it cannot be sent as a request `mode`.
        think_allowed:
          type: boolean
          description: Whether thinking was allowed for this call. Only present in fast mode.
        thought:
          type: boolean
          description: Whether a reasoning trace was actually generated.
        verification:
          $ref: "#/components/schemas/Verification"
        evidence:
          $ref: "#/components/schemas/Evidence"
        latency_ms:
          type: number
          description: Server-side processing time in milliseconds.
        model:
          type: string
          description: The model that produced this decision.
          example: dec-1
        input_tokens:
          type: integer
          description: Total tokens processed (text + images + documents + audio).
        image_tokens:
          type: integer
          description: Image-specific subset of `input_tokens`.
        document_tokens:
          type: integer
          description: Document-specific subset of `input_tokens`. Present when documents were sent.
        billable_tokens:
          type: integer
          description: |
            Billing token count = `max(1000, input_tokens)`. This is the number used
            for usage metering, with a per-decision floor of 1,000 tokens.
        document_notes:
          type: array
          items:
            $ref: "#/components/schemas/DocumentNote"
          description: Per-document extraction status. Present when documents were sent.

    BooleanDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [boolean]
            value:
              type: ["string", "null"]
              enum: ["yes", "no", null]
              description: The answer. Null when abstained.
            probability:
              type: number
              description: Probability of `value`. Omitted when the model abstains.
            distribution:
              type: object
              properties:
                "yes":
                  type: number
                "no":
                  type: number
              description: Probability of `yes` and of `no`, summing to 1. Present even on abstention.

    ChoiceDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [choice]
            value:
              type: ["string", "null"]
              description: The chosen option, one of the request `choices`. Null when abstained.
            probability:
              type: number
              description: Probability of `value`. Omitted when the model abstains.
            distribution:
              type: object
              additionalProperties:
                type: number
              description: Probability of each choice, summing to 1. Present even on abstention.

    CategoricalDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [decide, choice, boolean]
            probability:
              type: number
              description: P(value). Omitted when the model abstains.
            distribution:
              type: object
              additionalProperties:
                type: number
              description: |
                Probability of each label, summing to 1. Present even on abstention.
                For boolean decisions, keys are `yes` and `no`.
            read_as:
              type: ["object", "null"]
              additionalProperties: true
              description: 'Present on `/decide` when `outcomes` is omitted: reports how Bivia auto-framed the question (`read_as`, `question`, `choices`, `range`).'

    ScoreDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [score]
            value:
              type: ["number", "null"]
              description: Expected value on the requested range. Null when abstained.
            levels:
              type: object
              additionalProperties:
                type: number
              description: Per-level probability. Keys are formatted level values (e.g., `"0"`, `"0.1"`, `"1"`).

    SetDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [set]
            value:
              type: array
              items:
                x-stainless-any: true
              description: Options with probability ≥ 0.5, in request order.
            probabilities:
              type: object
              additionalProperties:
                type: number
              description: Independent P(option applies) for each option. Does not sum to 1.

    SpanDecision:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            type:
              type: string
              enum: [span]
            value:
              type: array
              items:
                $ref: "#/components/schemas/EvidenceSpan"
              description: Text spans found in the input.

    GroundRegion:
      type: object
      required: [label, box]
      properties:
        label:
          type: string
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: "`[x1, y1, x2, y2]` coordinates normalized to `[0, 1000]`."
        score:
          type: number
          description: Detection confidence.

    GroundDecision:
      type: object
      required: [type, value, count, found, grounded, input_tokens, image_tokens, billable_tokens]
      properties:
        type:
          type: string
          enum: [ground]
        value:
          type: array
          items:
            $ref: "#/components/schemas/GroundRegion"
          description: Detected regions. Empty array when nothing found.
        count:
          type: integer
          description: Number of matched bounding box regions.
        found:
          type: boolean
          description: True when at least one region matched (`count > 0`).
        grounded:
          type: boolean
          description: Always `true` for grounding responses.
        read_as:
          type: ["object", "null"]
          additionalProperties: true
          description: Present when `/decide` auto-framed the question as grounding.
        input_tokens:
          type: integer
          description: Total tokens processed (text + images + documents + audio).
        image_tokens:
          type: integer
          description: Image-specific subset of `input_tokens`.
        billable_tokens:
          type: integer
          description: Billing token count = `max(1000, input_tokens)`.

    VideoGroundDecision:
      type: object
      required: [type, kind, duration_s, hits]
      properties:
        type:
          type: string
          enum: [video_ground]
        kind:
          type: string
          enum: [object, event]
        duration_s:
          type: number
          description: Total clip duration in seconds.
        scanned:
          type: integer
          description: Number of frames probed.
        truncated:
          type: boolean
          description: Whether scanning was truncated by `max_probes`.
        hits:
          type: array
          items:
            type: object
          description: |
            For `kind: "object"` — each hit has `start`, `end`, `peak_t`, `confidence`,
            and optional `boxes` (array of GroundRegion).
            For `kind: "event"` — each hit has `onset_t` and `confidence`.
        input_tokens:
          type: integer
        image_tokens:
          type: integer
        billable_tokens:
          type: integer

    Usage:
      type: object
      required: [questions, input_tokens, billable_tokens]
      properties:
        questions:
          type: integer
          description: Number of questions in the batch request.
        input_tokens:
          type: integer
          description: Sum of per-question input tokens.
        output_tokens:
          type: integer
          description: Typically 0 for decision readouts.
        billable_tokens:
          type: integer
          description: Sum of per-question billing token minimums.

    Capabilities:
      type: object
      properties:
        model:
          type: string
          example: dec-1
        decision_types:
          type: array
          items:
            type: string
          description: Supported decision types on this deployment.
        modalities:
          type: object
          additionalProperties:
            type: object
          description: Available input modalities and their feature flags.
        evidence:
          type: object
          description: Supported evidence types.
        abstention:
          type: boolean
          description: Whether abstention is enabled.
        extraction:
          type: object
          additionalProperties: true
          description: Grounded field extraction capability metadata (`/extract`).
        openapi:
          type: string
          description: Path to the OpenAPI JSON specification.

    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            description: A model this API serves.
            required: [name, description, release_date]
            properties:
              name:
                type: string
                description: What clients pass as `model`.
              description:
                type: string
              release_date:
                type: string

    # ── Error types ────────────────────────────────────────────

    InvalidRequest:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [invalid_request]
        detail:
          type: string
          description: Human-readable error message.

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  x-stainless-any: true
                description: JSON path to the invalid field.
              msg:
                type: string
              type:
                type: string

    Overloaded:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [overloaded]
        detail:
          type: string

    ValidationIssue:
      type: object
      description: One problem with the request body's shape.
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: Kind of problem, e.g. "missing" or "string_type".
        loc:
          type: array
          items:
            type: ["string", "integer"]
          description: Where it is, e.g. `["body", "question"]`.
        msg:
          type: string
          description: What is wrong.
        input:
          description: The value that was sent.
          default: null

    ErrorBody:
      type: object
      description: |
        Error response body. Which fields are present depends on where the request was rejected:

        - **Bivia** (the request is well-formed but cannot be served): `error` and `detail`, e.g.
          `{"error": "invalid_request", "detail": "score needs at least two buckets"}`.
        - **Request validation** (a required field is missing or has the wrong type): `detail` is a list of issues.
        - **Gateway** (authentication): `message`, e.g. `{"message": "Authentication required"}`.
        - **Size limit:** `error` is `"payload too large"` and `limit_mb` gives the limit, or `detail` names the media
          that is too large.
      properties:
        error:
          type: ["string", "null"]
          default: null
          description: 'Machine-readable code: "invalid_request", "overloaded" or "payload too large".'
        detail:
          type: ["string", "array", "null"]
          default: null
          items:
            $ref: "#/components/schemas/ValidationIssue"
          description: What was wrong.
        message:
          type: ["string", "null"]
          default: null
          description: Gateway error message (authentication).
        limit_mb:
          type: ["integer", "null"]
          default: null
          description: Request size limit in MB (413 on the whole body).

    ExtractRequest:
      type: object
      description: Copy the exact value of one field (`question`) or several (`fields`) from a document, with character offsets.
      properties:
        state:
          type: string
          default: ""
          description: The document text. Documents add to it.
        documents:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/DocumentRef"
          description: |
            Files whose text is added to the state as context (pdf, docx, pptx, xlsx, txt, md, csv, json, html,
            source code), each `{b64 | url, filename?, mime?}`. Per-file status comes back in `document_notes`.
        question:
          type: ["string", "null"]
          description: One field to extract, e.g. "termination notice period".
        fields:
          type: ["array", "null"]
          items:
            type: string
          description: Several fields at once; the response maps each to its value.
      examples:
        - state: Either party may terminate this agreement with 60 days written notice.
          question: termination notice period
        - state: Either party may terminate this agreement with 60 days written notice.
          fields:
            - termination notice period
            - governing law

    ExtractValue:
      type: object
      description: 'One extracted field: the exact substring copied from the document, or `found: false`.'
      required: [type, field, value, found, grounded]
      properties:
        type:
          type: string
          const: extract
          description: The result type.
        field:
          type: string
          description: The field that was asked for.
        value:
          type: ["string", "null"]
          description: The exact source text for the field; null when not found.
        start:
          type: integer
          description: Character offset where the value starts. Present when found.
        end:
          type: integer
          description: Character offset where the value ends. Present when found.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Mean confidence over the selected text. Present when found.
        found:
          type: boolean
          description: Whether the document contains a value for the field.
        grounded:
          type: boolean
          const: true
          description: 'Always true: the value is copied from the document, not generated.'
        truncated:
          type: boolean
          description: Whether the input text was truncated before extraction.

    ExtractResult:
      description: Result of a single-field extraction (`question`).
      allOf:
        - $ref: "#/components/schemas/ExtractValue"
        - type: object
          properties:
            input_tokens:
              type: integer
              description: 'Tokens processed for this request: text, attached documents and images.'
            image_tokens:
              type: integer
              description: Image-tile part of `input_tokens`.
            document_tokens:
              type: ["integer", "null"]
              description: Document part of `input_tokens`; present when documents were sent.
            document_notes:
              type: ["array", "null"]
              items:
                $ref: "#/components/schemas/DocumentNote"
              description: Per-document status; present when documents were sent.
            billable_tokens:
              type: integer
              description: 'Tokens billed for this request: `max(1000, input_tokens)`.'

    ExtractFieldsResult:
      type: object
      description: 'Result of a multi-field extraction (`fields`): each field name maps to its value.'
      required: [type, values, grounded]
      properties:
        type:
          type: string
          const: extract
          description: The result type.
        values:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ExtractValue"
          description: One entry per requested field.
        grounded:
          type: boolean
          const: true
          description: 'Always true: values are copied from the document.'
        input_tokens:
          type: integer
          description: 'Tokens processed for this request: text, attached documents and images.'
        image_tokens:
          type: integer
          description: Image-tile part of `input_tokens`.
        document_tokens:
          type: ["integer", "null"]
          description: Document part of `input_tokens`; present when documents were sent.
        document_notes:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/DocumentNote"
          description: Per-document status; present when documents were sent.
        billable_tokens:
          type: integer
          description: 'Tokens billed for this request: `max(1000, input_tokens)`.'

    Health:
      type: object
      description: Response of `GET /health`.
      required: [status, ready, model, capabilities]
      properties:
        status:
          type: string
          const: ok
        ready:
          type: boolean
          description: Whether the service can serve decisions.
        model:
          type: string
          description: Model version.
        capabilities:
          type: object
          additionalProperties: true
          description: Same content as `GET /capabilities`.

    Readiness:
      type: object
      description: Response of `GET /ready`.
      required: [ready]
      properties:
        ready:
          type: boolean
